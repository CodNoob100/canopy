[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canopy"
version = "0.1.0"
description = "Tropical Geometry-Guided Neural Architecture Search"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
]
# Optional dependencies for downstream integrations; the core scoring code
# only requires NumPy and SciPy.
torch = ["torch>=2.0"]
geometry = ["pycddlib>=3.0.2"]
bench = [
    "nats-bench>=1.8",
]
eval = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["canopy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
