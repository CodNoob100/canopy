name: Python tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and testing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,eval]"

      - name: Run test suite
        run: python -m pytest -q

      - name: Verify clean virtualenv quickstart (core only)
        shell: bash
        run: |
          python -m venv .quickstart-venv
          .quickstart-venv/bin/python -m pip install --upgrade pip
          .quickstart-venv/bin/python -m pip install .
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE/.quickstart-venv/bin/python" -m canopy.cli --version
          "$GITHUB_WORKSPACE/.quickstart-venv/bin/python" -m canopy.cli score --widths 2,4,1
          "$GITHUB_WORKSPACE/.quickstart-venv/bin/python" -m canopy.cli score --widths 2,64,64,1 --mode tight --json
